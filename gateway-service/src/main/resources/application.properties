server.port=8005

spring.application.name=GATEWAY-SERVICE

spring.cloud.gateway.server.webmvc.routes[0].id=ACOES-SERVICES
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ACOES-SERVICES
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/acoes/**

spring.cloud.gateway.server.webmvc.routes[1].id=COTACOES-SERVICES
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://COTACOES-SERVICES
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/cotacoes/**

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
